<!--
  3D-Bausteine favicon.svg: the program icon of the modern look. It draws the motif of the caption
  icon app-16 of icons.js, a blue torus, a red cube and a green cone in the colours of the program
  icon of version 1.3, with the same shapes and fills. The lines are dark on a light tab strip and
  light on a dark one. The page shows it in the tab of the browser while the modern look is active.
-->
